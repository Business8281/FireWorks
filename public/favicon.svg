<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ignis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="50%" stop-color="#FF3B00" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="flame-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#7F1D1D" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Gradient Base Badge with smooth rounded corners matching IGNIS branding -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ignis-grad)" />

  <!-- Top Subtle Bevel Sheen -->
  <rect x="3" y="3" width="58" height="28" rx="14" fill="url(#sheen)" />

  <!-- Crisp Inner Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Centered Lucide Flame with subtle shadow -->
  <g transform="translate(9.2, 10.5) scale(1.9)" filter="url(#flame-shadow)">
    <path
      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="0.6"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>
</svg>